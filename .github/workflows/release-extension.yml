name: Release extension

on:
  push:
    branches: [main]
    paths:
      - "chrome-extension/manifest.json"
      - ".github/workflows/release-extension.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-extension
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: chrome-extension/package-lock.json

      - name: Check version and existing releases
        id: version
        run: |
          node --input-type=commonjs <<'JS'
          const fs = require('node:fs');
          const read = name => JSON.parse(fs.readFileSync(`chrome-extension/${name}`, 'utf8'));
          const version = read('manifest.json').version;
          const lock = read('package-lock.json');
          if (!/^\d+\.\d+\.\d+$/.test(version)) throw new Error('Expected a three-part version');
          if ([read('package.json').version, lock.version, lock.packages[''].version].some(v => v !== version)) {
            throw new Error('Extension version fields must match');
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `tag=v${version}\n`);
          JS
          tag="v$(node -p "require('./chrome-extension/manifest.json').version")"
          # A failed API request must fail the run, not look like a missing release.
          gh release list --limit 1000 --json tagName > /tmp/releases.json
          if jq -e --arg tag "$tag" 'any(.[]; .tagName == $tag)' /tmp/releases.json > /dev/null; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "$tag already exists; skipping." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install and build
        if: steps.version.outputs.publish == 'true'
        working-directory: chrome-extension
        run: |
          npm ci
          npm run build

      - name: Package extension
        if: steps.version.outputs.publish == 'true'
        working-directory: chrome-extension/dist
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: zip -r "$RUNNER_TEMP/hilltoppers-extension-$TAG.zip" .

      - name: Publish release
        if: steps.version.outputs.publish == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
          SHA: ${{ github.sha }}
        run: |
          gh release create "$TAG" "$RUNNER_TEMP/hilltoppers-extension-$TAG.zip" \
            --target "$SHA" --title "$TAG" --generate-notes
          echo "Published [$TAG](https://github.com/$GH_REPO/releases/tag/$TAG) with the extension ZIP." >> "$GITHUB_STEP_SUMMARY"
